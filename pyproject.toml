[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vispek-hc-viewer"
version = "0.1.0"
description = "Local web viewer for the Vispek HC1500 multispectral camera: live view, LED control, scans, spectra"
dynamic = ["readme"]  # README.md with absolute links: hatch_build.py
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jian Liu", email = "jian.liu@vispek.cn" },
    { name = "VISPEK Technology Co., Ltd", email = "contact@vispek.cn" },
]
keywords = ["multispectral", "camera", "spectral imaging", "viewer"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "vispek-hc>=0.1.0",
    "numpy>=1.26",
    "Pillow>=10.1",
]

[project.scripts]
vispek-hc-viewer = "vispek_hc_viewer.__main__:main"

[project.urls]
Repository = "https://github.com/vispek/vispek-hc-viewer"
Changelog = "https://github.com/vispek/vispek-hc-viewer/blob/main/CHANGELOG.md"
SDK = "https://github.com/vispek/vispek-hc-camera"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "twine>=6.1",
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/vispek_hc_viewer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/tools", "/.github", "/*.md", "/LICENSE", "/NOTICE", "/hatch_build.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/vispek_hc_viewer/__main__.py" = ["T20"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 60
xfail_strict = true
filterwarnings = ["error"]
